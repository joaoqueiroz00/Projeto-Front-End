<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TrendStart</title>
  <link rel="stylesheet" type="text/css" href="./Style/cadastrologin.css">
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topo">
    <a class="logo" href="index.html">⚡ TrendStart</a>
    <nav>
      <a href="index.html">Início</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card login-card">
      <span class="badge">🔐 Acesso</span>
      <h1>Entrar na plataforma</h1>
      <p class="subtitulo">Acesse sua conta para acompanhar tendências e oportunidades de negócio.</p>

      <form action="index.html" method="get">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <button type="submit">Entrar</button>
      </form>

      <p class="link-final">Ainda não possui conta? <a href="cadastro.html">Criar cadastro</a></p>
    </section>
  </main>

  <footer class="rodape">
    <p>© 2026 TrendStart </p>
  </footer>
</body>
</html>
