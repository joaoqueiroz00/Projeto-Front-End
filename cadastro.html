<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - TrendStart</title>
  <link rel="stylesheet" type="text/css" href="./Style/cadastrologin.css">
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topo">
    <a class="logo" href="index.html">⚡ TrendStart</a>
    <nav>
      <a href="index.html">Início</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <span class="badge">🚀 Comece sua jornada</span>
      <h1>Crie sua conta</h1>
      <p class="subtitulo">Preencha seus dados para acessar as tendências e validar ideias de negócio.</p>

      <form action="login.html" method="get">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

        <label for="perfil">Perfil de interesse</label>
        <select id="perfil" name="perfil" required>
          <option value="">Selecione uma opção</option>
          <option value="ecommerce">E-commerce</option>
          <option value="servicos">Serviços</option>
          <option value="infoprodutos">Infoprodutos</option>
          <option value="local">Negócio local</option>
        </select>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="Confirme sua senha" required>

        <button type="submit">Cadastrar e ir para Login</button>
      </form>

      <p class="link-final">Já possui conta? <a href="login.html">Entrar agora</a></p>
    </section>
  </main>

  <footer class="rodape">
    <p>© 2026 TrendStart</p>
  </footer>
</body>
</html>
